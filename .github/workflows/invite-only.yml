name: Invite-only registration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  invite-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./store -run TestInvite -count=1
      - run: go test ./api -run 'TestInviteHTTPRedemption|TestInviteOnlyRegistration|TestTenantSessionClaims|TestTenantIsolation' -count=1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci && npx vitest run src/components/auth/RegisterPage.gating.test.tsx
        working-directory: web
