name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # schema lock transition check needs the merge base with main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        # `workers` brings nautilus-trader. Without it the demo ledger silently
        # falls back to the reference model (assumed-mid arithmetic), which is
        # the exact regression ALG-3289 closed — so the tests that assert the
        # Nautilus executor either skip or fail, and CI proves nothing about
        # the path the demo actually runs on.
        run: pip install -e ".[dev,workers]"
      - name: Lint
        run: ruff check .
      - name: Schema lock transition
        run: python -m algobots.contracts --check-transition
      - name: Test
        run: pytest
