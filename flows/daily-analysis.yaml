id: algobots-daily-analysis
namespace: algobots
description: "Daily stock technical analysis — fetch, calculate, report"

triggers:
  - id: market-open
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "30 13 * * 1-5"
    timezone: America/New_York

inputs:
  - id: tickers
    type: ARRAY
    itemtype: STRING
    defaults:
      - AAPL
      - GOOGL
      - TSLA

tasks:
  - id: fetch
    type: io.kestra.plugin.scripts.python.Commands
    description: "Fetch OHLCV data from yfinance"
    namespaceFiles:
      enabled: true
    commands:
      - python src/algobots/fetcher.py --tickers {{ inputs.tickers | join(' ') }} --output data.json --period 3mo
    outputFiles:
      - "data.json"

  - id: indicators
    type: io.kestra.plugin.scripts.python.Commands
    description: "Calculate RSI, MACD, Bollinger, SMA, EMA"
    namespaceFiles:
      enabled: true
    inputFiles:
      data.json: "{{ outputs.fetch.outputFiles['data.json'] }}"
    commands:
      - python src/algobots/indicators.py --input data.json --output indicators.json
    outputFiles:
      - "indicators.json"

  - id: analyze
    type: io.kestra.plugin.scripts.python.Commands
    description: "Generate buy/sell/hold signals"
    namespaceFiles:
      enabled: true
    inputFiles:
      indicators.json: "{{ outputs.indicators.outputFiles['indicators.json'] }}"
    commands:
      - python src/algobots/analyzer.py --input indicators.json --output analysis.json
    outputFiles:
      - "analysis.json"

  - id: report
    type: io.kestra.plugin.scripts.python.Commands
    description: "Generate formatted markdown report"
    namespaceFiles:
      enabled: true
    inputFiles:
      analysis.json: "{{ outputs.analyze.outputFiles['analysis.json'] }}"
    commands:
      - python src/algobots/reporter.py --input analysis.json --output report.md
    outputFiles:
      - "report.md"

errors:
  - id: on-failure
    type: io.kestra.plugin.core.log.Log
    message: "AlgoBots pipeline FAILED"
