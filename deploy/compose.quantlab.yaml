# Overlay /opt/algobots-stack/docker-compose.yml; changes only quantlab.
services:
  marimo-quantlab:
    build:
      context: ${QUANTLAB_BUILD_CONTEXT:?set absolute repository path}
      dockerfile: deploy/quantlab/Dockerfile
    image: algobots/quantlab:alg3424
    user: "1000:1000"
    environment:
      HOME: /home/quantlab
    ports: !override
      - "100.82.57.72:8205:2718"
    volumes: !override
      - /mnt/funnytree-quantlab/algobots/quantlab:/home/quantlab
      - /mnt/funnytree-quantlab/algobots/openbb_store:/home/quantlab/openbb_store
      - /mnt/funnytree-quantlab/algobots/ntl_catalog:/home/quantlab/ntl_catalog
    entrypoint: [/bin/sh, /app/start.sh]
    command: [marimo, edit, /home/quantlab/notebooks, --host, 0.0.0.0, --port, "2718", --token-password, "${QUANTLAB_TOKEN:?set QUANTLAB_TOKEN in gitignored .env}", --headless]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:2718/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
