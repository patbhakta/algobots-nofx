# ALG-3414 (Oct 23 2026): :8201 is the funder demo. Deployed to
# /opt/algobots-stack/nofx-frontend-nginx.conf on .243 (mounted read-only).
#
# The browser authenticates against the AlgoBots API (A03 invite gate,
# DB-bound sessions) — not the retired NoFX Go backend. Only the NoFX-dialect
# compat surface (/api/nofx/*) is reachable through this port: NoFX's legacy
# paths (/api/login, /api/register, /api/logout, /api/config, /api/strategies)
# are rewritten onto it, every other /api path answers 410, and the
# synthetic-principal /demo routes are not proxied at all.

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    location / {
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # AlgoBots API (tailnet bind on the same host). Resolved per request, so a
    # frontend restart without the API never caches a dead upstream.
    # proxy_* at server level: inherited by every proxying location below.
    set $algobots_api http://100.82.57.72:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;

    location = /api/login    { rewrite ^ /api/nofx/login break;    proxy_pass $algobots_api; }
    location = /api/register { rewrite ^ /api/nofx/register break; proxy_pass $algobots_api; }
    location = /api/logout   { rewrite ^ /api/nofx/logout break;   proxy_pass $algobots_api; }
    location = /api/config   { rewrite ^ /api/nofx/config break;   proxy_pass $algobots_api; }

    location ~ ^/api/strategies(/.*)?$ {
        rewrite ^/api/strategies(.*)$ /api/nofx/strategies$1 break;
        proxy_pass $algobots_api;
    }

    location /api/nofx/ {
        proxy_pass $algobots_api;
    }

    # Everything else the NoFX UI used to call (traders, Vergex boards,
    # klines, wallets, the Go execution loop) is retired. 410, not 401, so the
    # session is not dropped by the client's 401 handler.
    location /api/ {
        default_type application/json;
        return 410 '{"error":"Retired: this NoFX endpoint is not part of the AlgoBots demo. Live data is in Strategy Studio."}';
    }

    location /health {
        return 200 "OK\n";
        add_header Content-Type text/plain;
        access_log off;
    }
}
