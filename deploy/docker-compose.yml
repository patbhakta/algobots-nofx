name: algobots

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-algobots}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-algobots}
      POSTGRES_DB: ${POSTGRES_DB:-algobots}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-algobots} -d $${POSTGRES_DB:-algobots}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      # Built from POSTGRES_* rather than ${DATABASE_URL}: a DATABASE_URL exported
      # in the host shell (e.g. an agent runtime's own DB) must never leak in.
      DATABASE_URL: postgresql://${POSTGRES_USER:-algobots}:${POSTGRES_PASSWORD:-algobots}@postgres:5432/${POSTGRES_DB:-algobots}
      REDIS_URL: redis://redis:6379/0
      # ALG-3248 demo: the Laya forward observer writes here every 15 min (read-only).
      ALGOBOTS_DEMO_FEED_PATH: /feeds/kalshi/observations.jsonl
      ALGOBOTS_DEMO_STATE_DIR: /var/lib/algobots-demo
      ALGOBOTS_DEMO_SLEEVE_REFILLS: ${ALGOBOTS_DEMO_SLEEVE_REFILLS:-}
      # ALG-3255: one Nautilus paper worker process per demo account (~350 MB RSS each).
      ALGOBOTS_DEMO_WORKERS_ENABLED: ${ALGOBOTS_DEMO_WORKERS_ENABLED:-1}
      # ALG-3340 NoFX<->Nautilus bridge: shared file channel (intents/ + fills/).
      # Mount the stack's bridge dir via ALGOBOTS_BRIDGE_HOST_DIR; empty
      # ALGOBOTS_BRIDGE_DIR disables the /bridge endpoints (typed 503).
      ALGOBOTS_BRIDGE_DIR: ${ALGOBOTS_BRIDGE_DIR:-/bridge}
    volumes:
      - ${LAYA_KALSHI_DIR:-/opt/laya/kalshi}:/feeds/kalshi:ro
      - demostate:/var/lib/algobots-demo
      - ${ALGOBOTS_BRIDGE_HOST_DIR:-./bridge}:/bridge
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  demostate:
